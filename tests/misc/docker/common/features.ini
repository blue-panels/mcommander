# Build profiles for build-mc.sh -f.  A profile is a group; "meson" is
# appended to the meson setup line, "cflags" to CFLAGS.  Several may be named,
# comma separated; "-name" takes a group's flags back out.
#
#   build -f all              everything the image can build
#   build -f all,ncurses      the same on ncurses instead of slang
#   build -f all,-arcmc       without the archive plugin
#   build -f minimal          no optional panel plugins, no lua

# "all" takes what the image has and leaves out what it has not; the profiles
# named after a plugin insist on it.
[all]
meson = -Dpanel_plugin_sftp=auto -Dpanel_plugin_arcmc=auto -Dpanel_plugin_ftp=auto -Dpanel_plugin_samba=auto -Dpanel_plugin_shell_link=auto -Dpanel_plugin_s3=auto -Dpanel_plugin_mongo=disabled

[minimal]
meson = -Dpanel_plugin_sftp=disabled -Dpanel_plugin_arcmc=disabled -Dpanel_plugin_ftp=disabled -Dpanel_plugin_samba=disabled -Dpanel_plugin_shell_link=disabled -Dpanel_plugin_s3=disabled -Dpanel_plugin_mongo=disabled -Dlua=disabled

[arcmc]
meson = -Dpanel_plugin_arcmc=enabled

[sftp]
meson = -Dpanel_plugin_sftp=enabled

[ftp]
meson = -Dpanel_plugin_ftp=enabled

[samba]
meson = -Dpanel_plugin_samba=enabled

[shell-link]
meson = -Dpanel_plugin_shell_link=enabled

[mongo]
meson = -Dpanel_plugin_mongo=enabled

[ncurses]
meson = -Dscreen=ncurses

[slang]
meson = -Dscreen=slang

[asan]
cflags = -fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g

# what memcheck wants: the frames of a stack, and no optimiser inventing them
[debug]
cflags = -O0 -g3 -fno-omit-frame-pointer
