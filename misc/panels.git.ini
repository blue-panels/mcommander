[git-panel]
default_format=type name | status | mtime
hotkey_stage=f15
hotkey_unstage=f16
hotkey_toggle=none
hotkey_diff=ctrl-d
hotkey_diff_alt=f13
hotkey_refresh=ctrl-r
hotkey_reset=f18
coole_executable=coole
hotkey_coole=alt-g
hotkey_commit=alt-c
hotkey_amend=alt-a
hotkey_show=alt-v
hotkey_reword=alt-r
