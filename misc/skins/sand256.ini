[skin]
    description = Sand skin using 256 colors
    256colors = true

[lines]
    horiz = ╌
    vert = ┆
    lefttop = ╭
    righttop = ╮
    leftbottom = ╰
    rightbottom = ╯
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ╭
    drighttop = ╮
    dleftbottom = ╰
    drightbottom = ╯
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[scrollbar]
    vstart = ^
    vend = v
    vtrack = ┆
    vthumb = █
    vthumblen = 6
    hstart = <
    hend = >
    htrack = ╌
    hthumb = ■
    hthumblen = 4

[core]
    _default_ = black;rgb554
    selected = ;rgb452
    marked = rgb400;;italic
    markselect = rgb400;rgb452;italic
    gauge = ;rgb452
    input = ;rgb452
    inputunchanged = gray;rgb452
    inputmark = rgb452;gray
    disabled = gray;rgb553
    reverse = ;rgb452
    commandlinemark = white;gray
    header = red;;italic
    shadow = black;rgb221
    frame = black;rgb554
    permread = brown
    spinner_sequence = ⠈⠐⠠⢀⡀⠄⠂⠁⠉⠘⠰⢠⣀⡄⠆⠃⠋⠙⠸⢰⣠⣄⡆⠇⠏⠛⠹⢸⣰⣤⣆⡇⡏⠟⠻⢹⣸⣴⣦⣇⣏⡟⠿⢻⣹⣼⣶⣧⣯⣟⡿⢿⣻⣽⣾⣷⣿⣯⣏⡏⠏⠋⠉

[dialog]
    _default_ = black;rgb553
    dfocus = ;rgb452
    dhotnormal = ;;underline
    dhotfocus = ;rgb452;underline
    dselnormal = ;rgb452
    dselfocus = ;rgb452
    dtitle = ;;italic+underline
    dframe = black;rgb553

[error]
    _default_ = rgb554;rgb320;bold
    # "black" might change color when going bold, so use "rgb000" instead
    errdfocus = rgb000;rgb452;bold
    errdhotnormal = ;;bold+underline
    errdhotfocus = rgb000;rgb452;bold+underline
    errdtitle = ;;bold+italic+underline
    errdframe = rgb554;rgb320;bold

[filehighlight]
    _default_ =
    directory =
    executable = rgb030
    symlink = rgb202
    hardlink =
    # 404 Not Found :)
    stalelink = rgb404
    device = rgb231
    special = rgb331
    core = rgb430
    temp = gray15
    archive = rgb012
    doc = rgb103
    source = rgb310
    media = rgb024
    graph = rgb033
    database = rgb421

[mctree]
    _default_ = black;rgb554
    key = blue;rgb554
    value = rgb030;rgb554
    marker = black;rgb554;bold
