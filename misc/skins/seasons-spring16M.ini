# The Four Seasons skins demonstrate how to use direct RGB true colors.

[skin]
    # Blooming.
    # Slightly inspired by Gmail's Cherry Blossom theme.
    description = Four Seasons – Spring
    truecolors = true

[lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[scrollbar]
    vstart = ^
    vend = v
    vtrack = │
    vthumb = █
    vthumblen = 6
    hstart = <
    hend = >
    htrack = ─
    hthumb = ■
    hthumblen = 4

[aliases]
    Main = #f3ffe7
    MainFg = #000
    MarkedFg = #d14576
    HeaderFg = MarkedFg
    Selected = #d5f1b7
    Dialog = Selected
    DialogFocus = #b3de85
    Input = Main
    PaleFg = #777
    ShadowFg = #000
    ShadowBg = #797f73
    Error = #c62b41
    ErrorFocus = #e16d7e
    Top = #f699a6
    MenuActive = Bottom
    MenuSelected = Top
    Bottom = #ffc3cb
    BottomNumber = #f4ef57
    BottomNumberFg = #000
    Help = #f6f28f
    HelpBoldFg = #a95965
    HelpItalicFg = Error
    HelpLinkFg = #699f2f
    EditorLineNumber = BottomNumber
    EditorWhitespace = #fafff5
    EditorRightMargin = EditorWhitespace
    EditorBookmark = BottomNumber
    EditorFindAll = Bottom
    EditorVoid = BottomNumber
    EditorFrameFg = MainFg
    EditorFrameActiveFg = MarkedFg
    EditorFrameDragFg = DialogFocus
    ViewerBoldFg = HelpBoldFg
    ViewerUnderlinedFg = HelpLinkFg
    ViewerSelected = EditorBookmark
    DiffAdd = #80e080
    DiffChangedLine = BottomNumber
    DiffGap = #e08080
    StructDimFg = PaleFg
    TreeKeyFg = #005f87
    TreeValueFg = #699f2f
    StructJumpFg = #0087d7
    StructRemarkFg = #699f2f
    StructChangedFg = #5f00af
    StructBlock = Top
    StructDimFg = PaleFg
    TreeKeyFg = #005f87
    TreeValueFg = #699f2f
    StructJumpFg = #0087d7
    StructRemarkFg = #699f2f
    StructChangedFg = #5f00af
    StructBlock = Top

[core]
    _default_ = MainFg;Main
    selected = ;Selected
    marked = MarkedFg;;bold
    markselect = MarkedFg;Selected;bold
    gauge = ;DialogFocus
    input = #000;Input
    inputunchanged = PaleFg;Input
    inputmark = #000;DialogFocus
    disabled = PaleFg;Dialog
    reverse = #000;Bottom
    commandlinemark = #000;DialogFocus
    header = HeaderFg
    shadow = ShadowFg;ShadowBg
    frame = MainFg;Main
    permread = brown
    spinner_sequence = ▲▲◀◀▼▼▶▶

[dialog]
    _default_ = #000;Dialog
    dfocus = ;DialogFocus
    dhotnormal = ;;underline
    dhotfocus = ;DialogFocus;underline
    dselnormal = ;DialogFocus
    dselfocus = ;DialogFocus
    dtitle = ;;bold
    dframe = #000;Dialog

[error]
    _default_ = #fff;Error
    errdfocus = ;ErrorFocus
    errdhotnormal = ;;underline
    errdhotfocus = ;ErrorFocus;underline
    errdtitle = ;;bold
    errdframe = #fff;Error

[filehighlight]
    _default_ =
    directory =
    executable = #00af00
    symlink = #870087
    hardlink =
    stalelink = #d70000
    device = #87af5f
    special = #afaf5f
    core = #d7af00
    temp = #9e9e9e
    archive = #005f87
    doc = #5f00af
    source = #af5f00
    media = #0087d7
    graph = #00afaf
    database = #d7875f

[mctree]
    _default_ = MainFg;Main
    key = TreeKeyFg;Main
    value = TreeValueFg;Main
    marker = MarkedFg;Main
    selected = #000;ViewerSelected

[menu]
    _default_ = #000;MenuActive
    menusel = ;MenuSelected
    menuhot = ;;underline
    menuhotsel = ;MenuSelected;underline
    menuinactive = ;Top
    menuframe = #000;MenuActive

[popupmenu]
    _default_ = #000;Dialog
    menusel = ;DialogFocus
    menutitle = ;;bold
    menuframe = #000;Dialog

[buttonbar]
    hotkey = BottomNumberFg;BottomNumber
    button = #000;Bottom

[statusbar]
    _default_ = #000;Top

[help]
    _default_ = #000;Help
    helpbold = HelpBoldFg;;bold
    helpitalic = HelpItalicFg;;italic
    helplink = HelpLinkFg;;underline
    helpslink = Help;HelpLinkFg
    helpframe = #000;Help

[editor]
    _default_ = MainFg;Main
    editbold = MarkedFg;;bold
    editmarked = ;Selected
    editwhitespace = ;EditorWhitespace
    editnonprintable = #000;Bottom
    editlinestate = #000;EditorLineNumber
    bookmark = #000;EditorBookmark
    bookmarkfound = #000;EditorFindAll
    editrightmargin = ;EditorRightMargin
    editbg = ;EditorVoid
    editframe = EditorFrameFg
    editframeactive = EditorFrameActiveFg
    editframedrag = EditorFrameDragFg

[viewer]
    _default_ = MainFg;Main
    viewbold = ViewerBoldFg;;bold
    viewunderline = ViewerUnderlinedFg;;underline
    viewboldunderline = ViewerBoldFg;;bold+underline
    viewselected = #000;ViewerSelected
    viewframe = MainFg;Main

[mcterm]
    _default_ = MainFg;Main
    mctermselected = MainFg;Selected

[diffviewer]
    added = ;#c5e7bc
    changedline = ;#d8e0b0
    changednew = ;#a6d79f
    changed = ;#dfd3bf
    removed = ;#dfd3bf
    error = #fff;Error

[widget-panel]
    sort-up-char = ▴
    sort-down-char = ▾
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ◂
    history-next-item-char = ▸
    history-show-list-char = ▾
    filename-scroll-left-char = ◂
    filename-scroll-right-char = ▸

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
    fold-open-char = ▾
    fold-close-char = ▸

[mcstruct-tree]
    _default_ = MainFg;Main
    frame = EditorFrameFg;Main
    frame-active = EditorFrameActiveFg;Main
    head = #000;Top
    selected = MainFg;Selected
    offset = StructDimFg;Main
    name = MainFg;Main
    type = StructDimFg;Main
    value = MainFg;Main;bold
    struct = MarkedFg;Main;bold
    jump = StructJumpFg;Main;underline
    remark = StructRemarkFg;Main;italic
    error = #fff;Error

[mcstruct-hex]
    _default_ = MainFg;Main
    head = #000;Top
    offset = StructDimFg;Main
    mark = StructJumpFg;Main
    changed = StructChangedFg;Main
    cursor = MainFg;Selected
    frame = EditorFrameFg;Main
    block = #000;StructBlock

[mcstruct-def]
    _default_ = MainFg;Main
    frame = EditorFrameFg;Main
    frame-active = EditorFrameActiveFg;Main
    head = #000;Top
    selected = MainFg;Selected
    lineno = StructDimFg;Main
    directive = MarkedFg;Main;bold
    comment = StructDimFg;Main;italic
    label = StructJumpFg;Main;underline
