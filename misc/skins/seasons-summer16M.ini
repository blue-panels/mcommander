# The Four Seasons skins demonstrate how to use direct RGB true colors.

[skin]
    # Sunshine, ocean, beach, beachball, sunshades, ice cream.
    # (Pistachio is out.)
    description = Four Seasons – Summer
    truecolors = true

[lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[scrollbar]
    vstart = ^
    vend = v
    vtrack = │
    vthumb = █
    vthumblen = 6
    hstart = <
    hend = >
    htrack = ─
    hthumb = ■
    hthumblen = 4

[aliases]
    Main = #ffedb3
    MainFg = #000
    MarkedFg = #e311aa
    HeaderFg = MarkedFg
    Selected = #d9b64a
    Dialog = #a7f25a
    DialogFocus = #f864f6
    Input = #d7ffad
    PaleFg = #777
    ShadowFg = #000
    ShadowBg = #7f7659
    Error = #d40707
    ErrorFocus = #db7b7b
    Top = #46cef3
    MenuActive = #85e1fb
    MenuSelected = #fae728
    Bottom = #f4ff83
    BottomNumber = DialogFocus
    BottomNumberFg = #000
    Help = Bottom
    HelpBoldFg = DialogFocus
    HelpItalicFg = ErrorFocus
    HelpLinkFg = #168bac
    EditorLineNumber = #fff5d5
    EditorWhitespace = EditorLineNumber
    EditorRightMargin = EditorWhitespace
    EditorBookmark = Bottom
    EditorFindAll = Top
    EditorVoid = #f9faac
    EditorFrameFg = MainFg
    EditorFrameActiveFg = MarkedFg
    EditorFrameDragFg = Top
    ViewerBoldFg = MarkedFg
    ViewerUnderlinedFg = HelpLinkFg
    ViewerSelected = Dialog
    DiffAdd = #80e080
    DiffChangedLine = Bottom
    DiffGap = #e08080
    StructDimFg = PaleFg
    TreeKeyFg = #168bac
    TreeValueFg = #00af00
    StructJumpFg = #168bac
    StructRemarkFg = #00af00
    StructChangedFg = #5f00af
    StructBlock = Top
    StructDimFg = PaleFg
    TreeKeyFg = #168bac
    TreeValueFg = #00af00
    StructJumpFg = #168bac
    StructRemarkFg = #00af00
    StructChangedFg = #5f00af
    StructBlock = Top

[core]
    _default_ = MainFg;Main
    selected = ;Selected
    marked = MarkedFg;;bold
    markselect = MarkedFg;Selected;bold
    gauge = ;DialogFocus
    input = #000;Input
    inputunchanged = PaleFg;Input
    inputmark = #000;DialogFocus
    disabled = PaleFg;Dialog
    reverse = #000;Bottom
    commandlinemark = #000;DialogFocus
    header = HeaderFg
    shadow = ShadowFg;ShadowBg
    frame = MainFg;Main
    spinner_sequence = ╭╭──╮╮││╯╯──╰╰││
    permread = brown

[dialog]
    _default_ = #000;Dialog
    dfocus = ;DialogFocus
    dhotnormal = ;;underline
    dhotfocus = ;DialogFocus;underline
    dselnormal = ;DialogFocus
    dselfocus = ;DialogFocus
    dtitle = ;;bold
    dframe = #000;Dialog

[error]
    _default_ = #fff;Error
    errdfocus = ;ErrorFocus
    errdhotnormal = ;;underline
    errdhotfocus = ;ErrorFocus;underline
    errdtitle = ;;bold
    errdframe = #fff;Error

[filehighlight]
    _default_ =
    directory =
    executable = #00af00
    symlink = #870087
    hardlink =
    stalelink = #d70000
    device = #87af5f
    special = #afaf5f
    core = #d7af00
    temp = #9e9e9e
    archive = #005f87
    doc = #5f00af
    source = #af5f00
    media = #0087d7
    graph = #00afaf
    database = #d7875f

[mctree]
    _default_ = MainFg;Main
    key = TreeKeyFg;Main
    value = TreeValueFg;Main
    marker = MarkedFg;Main
    selected = #000;ViewerSelected

[menu]
    _default_ = #000;MenuActive
    menusel = ;MenuSelected
    menuhot = ;;underline
    menuhotsel = ;MenuSelected;underline
    menuinactive = ;Top
    menuframe = #000;MenuActive

[popupmenu]
    _default_ = #000;Dialog
    menusel = ;DialogFocus
    menutitle = ;;bold
    menuframe = #000;Dialog

[buttonbar]
    hotkey = BottomNumberFg;BottomNumber
    button = #000;Bottom

[statusbar]
    _default_ = #000;Top

[help]
    _default_ = #000;Help
    helpbold = HelpBoldFg;;bold
    helpitalic = HelpItalicFg;;italic
    helplink = HelpLinkFg;;underline
    helpslink = Help;HelpLinkFg
    helpframe = #000;Help

[editor]
    _default_ = MainFg;Main
    editbold = MarkedFg;;bold
    editmarked = ;Selected
    editwhitespace = ;EditorWhitespace
    editnonprintable = #000;Bottom
    editlinestate = #000;EditorLineNumber
    bookmark = #000;EditorBookmark
    bookmarkfound = #000;EditorFindAll
    editrightmargin = ;EditorRightMargin
    editbg = ;EditorVoid
    editframe = EditorFrameFg
    editframeactive = EditorFrameActiveFg
    editframedrag = EditorFrameDragFg

[viewer]
    _default_ = MainFg;Main
    viewbold = ViewerBoldFg;;bold
    viewunderline = ViewerUnderlinedFg;;underline
    viewboldunderline = ViewerBoldFg;;bold+underline
    viewselected = #000;ViewerSelected
    viewframe = MainFg;Main

[mcterm]
    _default_ = MainFg;Main
    mctermselected = MainFg;Selected

[diffviewer]
    added = ;#cad78f
    changedline = ;#d9cf83
    changednew = ;#a7c978
    changed = ;#e6bf91
    removed = ;#e6bf91
    error = #fff;Error

[widget-panel]
    sort-up-char = ▴
    sort-down-char = ▾
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ◂
    history-next-item-char = ▸
    history-show-list-char = ▾
    filename-scroll-left-char = ◂
    filename-scroll-right-char = ▸

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
    fold-open-char = ▾
    fold-close-char = ▸

[mcstruct-tree]
    _default_ = MainFg;Main
    frame = EditorFrameFg;Main
    frame-active = EditorFrameActiveFg;Main
    head = #000;Top
    selected = MainFg;Selected
    offset = StructDimFg;Main
    name = MainFg;Main
    type = StructDimFg;Main
    value = MainFg;Main;bold
    struct = MarkedFg;Main;bold
    jump = StructJumpFg;Main;underline
    remark = StructRemarkFg;Main;italic
    error = #fff;Error

[mcstruct-hex]
    _default_ = MainFg;Main
    head = #000;Top
    offset = StructDimFg;Main
    mark = StructJumpFg;Main
    changed = StructChangedFg;Main
    cursor = MainFg;Selected
    frame = EditorFrameFg;Main
    block = #000;StructBlock

[mcstruct-def]
    _default_ = MainFg;Main
    frame = EditorFrameFg;Main
    frame-active = EditorFrameActiveFg;Main
    head = #000;Top
    selected = MainFg;Selected
    lineno = StructDimFg;Main
    directive = MarkedFg;Main;bold
    comment = StructDimFg;Main;italic
    label = StructJumpFg;Main;underline
