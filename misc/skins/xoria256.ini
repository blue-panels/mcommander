# This is a 256 colors MidnightCommander color scheme
# based on the Xoria256 color scheme for the Vim editor
# (https://www.vim.org/scripts/script.php?script_id=2140)

# Author      : Alexander Glyzov (isee@inbox.ru)
# Last Change : Jan 11, 2011

# Special Thanks to Dmitriy Zotikov -- author of the Vim Xoria256 color scheme.

[skin]
    description = Xoria256
    256colors = true

[lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[scrollbar]
    vstart = ^
    vend = v
    vtrack = │
    vthumb = █
    vthumblen = 6
    hstart = <
    hend = >
    htrack = ─
    hthumb = ■
    hthumblen = 4

[core]
    _default_ = color250;color234
    selected = ;color60
    marked = color228
    markselect = color228;color60
    reverse = color234;color250;
    header = color180;;bold
    frame = color250;color234

    gauge = white;black

    input = color252;color60;bold
    inputunchanged = color250;color60;bold
    inputmark = color228;color236;bold

    disabled = color244;color250

    #inputhistory =
    #commandhistory =
    #commandlinemark = black;lightgray

    shadow = color239;black

[dialog]
    _default_ = black;color250
    dhotnormal = color88;;
    dfocus = black;color73;
    dhotfocus = color88;color73;
    dselnormal = black;color73;
    dselfocus = color88;color73;
    dtitle = color235;;bold
    dframe = black;color250

[error]
    _default_ = white;red
    errdfocus = black;lightgray
    errdhotnormal = yellow;red
    errdhotfocus = yellow;lightgray
    errdtitle = yellow;red;bold
    errdframe = white;red

[filehighlight]
    _default_ =
    directory = ;;bold
    executable = color114
    symlink = color180
    hardlink =
    stalelink = rgb404
    device = rgb231
    special = rgb331
    core = rgb430
    temp = color239
    archive = color174
    doc = rgb033
    source = color29
    media = color110
    graph = color182
    database = color31

[mctree]
    _default_ = color250;color234
    key = color110;color234
    value = color114;color234
    marker = color254;color234
    selected = color228;color60

[menu]
    _default_ = black;color250
    menusel = black;color73;
    menuhot = color88;;
    menuhotsel = color88;color73;
    menuinactive = color244
    menuframe = black;color250

[popupmenu]
    _default_ = black;color250
    menusel = black;color73
    menutitle = ;;bold
    menuframe = black;color250

[buttonbar]
    button = black;color250
    hotkey = color88;color181;bold

[statusbar]
    _default_ = black;color250

[help]
    _default_ = black;color250
    helpitalic = color88;;bold
    helpbold = color235;;bold
    helplink = color19;;
    helpslink = black;color73;inverse
    helptitle = color235;;bold
    helpframe = black;color250

[editor]
    _default_ = color250;color234
    editbold = ;;bold
    editmarked = ;color60
    editwhitespace = color236;color234
    editnonprintable = ;black
    editlinestate = ;color235
    bookmark = ;color239;
    bookmarkfound = ;color239;bold
    editrightmargin = color180;color235;bold
#    editbg =
    editframe = color244;
    editframeactive = color250;
    editframedrag = color73;

[viewer]
    _default_ = color250;color234
    viewbold = ;;bold
    viewunderline = ;;underline
    viewboldunderline = ;;bold+underline
    viewselected = color228;color60
    viewframe = color250;color234

[mcterm]
    _default_ = color250;color234
    mctermselected = color228;color60

[diffviewer]
    changedline = ;color17
    changednew = color249;color124
    added = color244;color52
    changed = color145;color22
    removed = ;color238
    error = rgb554;rgb320

[widget-panel]
    sort-up-char = ↑
    sort-down-char = ↓
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = «
    history-next-item-char = »
    history-show-list-char = ⇊
    filename-scroll-left-char = ❰
    filename-scroll-right-char = ❱

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
    fold-open-char = ▾
    fold-close-char = ▸

[mcstruct-tree]
    _default_ = color250;color234
    frame = color244;color234
    frame-active = color254;color234
    head = black;color250
    selected = color250;color60
    offset = color244;color234
    name = color250;color234
    type = color244;color234
    value = color254;color234
    struct = color228;color234
    jump = color110;color234
    remark = color114;color234
    error = white;red

[mcstruct-hex]
    _default_ = color250;color234
    head = black;color250
    offset = color180;color234
    mark = color110;color234
    changed = color174;color234
    cursor = color250;color60
    frame = color244;color234
    block = black;color73

[mcstruct-def]
    _default_ = color250;color234
    frame = color244;color234
    frame-active = color254;color234
    head = black;color250
    selected = color250;color60
    lineno = color244;color234
    directive = color228;color234
    comment = color244;color234
    label = color110;color234
