[diffviewer]
    changedline = color117;color23
    changednew = color231;color124
    changed = color117;color23
    added = color120;color22
    removed = color210;color52
    error = color231;color52

[widget-panel]
    sort-up-char = ↑
    sort-down-char = ↓
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ‹
    history-next-item-char = ›
    history-show-list-char = ↓
    filename-scroll-left-char = ❬
    filename-scroll-right-char = ❭

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕

[mcterm]
    _default_ = color189;color234
    mctermselected = color234;color254
