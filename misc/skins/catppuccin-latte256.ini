# Catppuccin Latte (Light) theme for Midnight Commander
# Based on the Catppuccin color scheme: https://github.com/catppuccin/catppuccin
# Light version of the soothing pastel theme

[skin]
    description = Catppuccin Latte - Light soothing pastel theme
    256colors = true

[lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ┌
    drighttop = ┐
    dleftbottom = └
    drightbottom = ┘
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[scrollbar]
    vstart = ^
    vend = v
    vtrack = │
    vthumb = █
    vthumblen = 6
    hstart = <
    hend = >
    htrack = ─
    hthumb = ■
    hthumblen = 4

[core]
    _default_ = color238;color255
    selected = color255;color69
    marked = color172;color255
    markselect = color178;color69
    gauge = color238;color250
    input = color255;color69
    inputunchanged = color250;color69
    inputmark = color69;color255
    disabled = color245;color248
    reverse = color255;color238
    hintbar = default;default
    shellprompt = default;default
    commandline = default;default
    commandlinemark = color255;color238
    header = color172;color255
    inputhistory =
    commandhistory =
    shadow = color245;color252
    frame = color238;color255
    permread = brown

[dialog]
    _default_ = color255;color248
    dfocus = color255;color69
    dhotnormal = color69;color248
    dhotfocus = yellow;color69
    dselnormal = lightgray;color69
    dselfocus = color255;color69
    dtitle = color69;color248
    dframe = color255;color248

[error]
    _default_ = color238;color210
    errdfocus = color255;color248
    errdhotnormal = color172;color210
    errdhotfocus = brightred;color248
    errdtitle = color172;color210
    errdframe = color238;color210

[filehighlight]
    _default_ =
    directory = color238;
    executable = color151;
    symlink = color245;
    hardlink =
    stalelink = color210;
    device = color219;
    special = color69;
    core = color210;
    temp = color245;
    archive = color219;
    doc = color180;
    source = color111
    media = color151;
    graph = color109
    database = color210;

[mctree]
    _default_ = color238;color255
    key = color111;color255
    value = color71;color255
    marker = color245;color255
    selected = yellow;color69

[menu]
    _default_ = color238;color252
    menusel = color255;color69
    menuhot = color172;color252
    menuhotsel = brightred;color69
    menuinactive = color245;color252
    menuframe = color238;color252

[popupmenu]
    _default_ = color238;color252
    menusel = color255;color69
    menutitle = color172;color252
    menuframe = color238;color252

[buttonbar]
    hotkey = color238;color255
    button = color255;color69

[statusbar]
    _default_ = color255;color69

[help]
    _default_ = color255;color248
    helpitalic = color202;color248
    helpbold = color69;color248
    helplink = color255;color69
    helpslink = color214;color69
    helptitle = color69;color248
    helpframe = color255;color248

[editor]
    _default_ = color238;color255
    editbold = color172;color151
    editmarked = color255;color69
    editwhitespace = color69;color255
    editnonprintable = color69;color255
    editlinestate = color238;color69
    bookmark = color238;color210
    bookmarkfound = color229;color151
    editrightmargin = color69;color255
    editframeactive = color238;
    editframedrag = color151;

[viewer]
    _default_ = color238;color255
    viewbold = color172;color255
    viewunderline = color210;color255
    viewboldunderline = color172;color255
    viewselected = yellow;color69
    viewframe = color238;color255

[diffviewer]
    added = color238;color151
    changedline = color238;color152
    changednew = color231;color110
    changed = color238;color152
    removed = color238;color181
    error = color202;color248

[widget-panel]
    sort-up-char = ↑
    sort-down-char = ↓
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ‹
    history-next-item-char = ›
    history-show-list-char = ↓
    filename-scroll-left-char = ❬
    filename-scroll-right-char = ❭

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕

[mcterm]
    _default_ = color238;color255
    mctermselected = color255;gray

[mcstruct-tree]
    _default_ = color238;color255
    frame = color245;color255
    frame-active = color238;color255
    head = color172;color255
    selected = color255;color69
    offset = color245;color255
    name = color238;color255
    type = color111;color255
    value = color71;color255
    struct = color172;color255
    jump = color69;color255
    remark = color245;color255
    error = color238;color210

[mcstruct-hex]
    _default_ = color238;color255
    head = color172;color255
    offset = color245;color255
    mark = color111;color255
    changed = color170;color255
    cursor = color255;color69
    frame = color245;color255
    block = color238;color151

[mcstruct-def]
    _default_ = color238;color255
    frame = color245;color255
    frame-active = color238;color255
    head = color172;color255
    selected = color255;color69
    lineno = color245;color255
    directive = color172;color255
    comment = color245;color255
    label = color111;color255
