    dfocus = ;main1
    dhotnormal = main2
    dhotfocus = main2;main1
    dselnormal = ;main1
    dselfocus = main2;main1
    dtitle = main2
    dframe = rgb000;bgdarker

[error]
    _default_ = rgb555;rgb400;bold
    errdfocus = ;main2
    errdhotnormal = main1
    errdhotfocus = main1;main2
    errdtitle = main1
    errdframe = rgb555;rgb400;bold

[filehighlight]
    _default_ =
    directory =
    executable = rgb030
    symlink = rgb202
    hardlink =
    stalelink = rgb400
    device = rgb231
    special = rgb331
    core = rgb430
    temp = gray15
    archive = rgb012
    doc = rgb103
    source = rgb310
    media = rgb024
    graph = rgb033
    database = rgb421

[mctree]
    _default_ = rgb000;bgmain
    key = main2;bgmain
    value = rgb020;bgmain
    marker = rgb000;bgmain;bold
    selected = main2;main1;bold

[menu]
    _default_ = rgb000;bgdarker
    menusel = ;main1
    menuhot = main2
    menuhotsel = main2;main1
    menuinactive =
    menuframe = rgb000;bgdarker

[popupmenu]
    _default_ = rgb000;bgdarker
    menusel = ;main1
    menutitle = main2
    menuframe = rgb000;bgdarker

[buttonbar]
    hotkey = rgb000;bgmain
    button = rgb000;bgdarker

[statusbar]
    _default_ = rgb000;bgdarker

[help]
    _default_ = rgb000;bgdarker
    helpitalic = rgb020
    helpbold = rgb300
    helplink = main2;;underline
    helpslink = bgdarker;main2
    helptitle = main2
    helpframe = rgb000;bgdarker

[editor]
    _default_ = rgb000;bgmain
    editbold = rgb400
    editmarked = ;main1
    editwhitespace = rgb400;bgdarker
    editnonprintable = red
    editlinestate = ;bgdarker
    bookmark = ;main1
    bookmarkfound = lightgray;main2
    editrightmargin = rgb400;bgdarker
#    editbg =
    editframe = main2;
    editframeactive = rgb000;
    editframedrag = rgb400;

[viewer]
    _default_ = rgb000;bgmain
    viewbold = rgb000;;bold
    viewunderline = brown;;underline
    viewboldunderline = color25;;bold+underline
    viewselected = main2;main1;bold
    viewframe = rgb000;bgmain

[mcterm]
