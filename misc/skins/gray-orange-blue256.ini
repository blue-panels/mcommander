[skin]
    description = Gray-Orange-Blue Skin
    256colors = true

[lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[scrollbar]
    vstart = ^
    vend = v
    vtrack = │
    vthumb = █
    vthumblen = 6
    hstart = <
    hend = >
    htrack = ─
    hthumb = ■
    hthumblen = 4

[aliases]
    bgmain = gray22
    bgbitdarker = gray21
    bgdarker = gray20
    main1 = rgb530
    main2 = rgb004

[core]
    _default_ = rgb000;bgmain
    selected = ;main1
    marked = main2;;bold
    markselect = main2;main1;bold
    gauge = ;main1
    input =
    inputunchanged = gray
    inputmark = ;main1
    disabled = gray8;bgdarker
    reverse =
    commandlinemark = ;main1
    header = main2
    shadow = rgb000;gray12
    frame = rgb000;bgmain
    spinner_sequence = ⠈⠐⠠⢀⡀⠄⠂⠁⠉⠘⠰⢠⣀⡄⠆⠃⠋⠙⠸⢰⣠⣄⡆⠇⠏⠛⠹⢸⣰⣤⣆⡇⡏⠟⠻⢹⣸⣴⣦⣇⣏⡟⠿⢻⣹⣼⣶⣧⣯⣟⡿⢿⣻⣽⣾⣷⣿⣯⣏⡏⠏⠋⠉

[dialog]
