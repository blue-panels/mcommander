# Tokyo Night — truecolor skin based on the Tokyo Night palette by enkia
# (https://github.com/enkia/tokyo-night-vscode-theme).

[skin]
description=Tokyo Night
truecolors=true

[lines]
horiz=─
vert=│
lefttop=┌
righttop=┐
leftbottom=└
rightbottom=┘
topmiddle=┬
bottommiddle=┴
leftmiddle=├
rightmiddle=┤
cross=┼
dhoriz=─
dvert=│
dlefttop=┌
drighttop=┐
dleftbottom=└
drightbottom=┘
dtopmiddle=┬
dbottommiddle=┴
dleftmiddle=├
drightmiddle=┤

[scrollbar]
    vstart = ^
    vend = v
    vtrack = │
    vthumb = █
    vthumblen = 6
    hstart = <
    hend = >
    htrack = ─
    hthumb = ■
    hthumblen = 4

[aliases]
    # Tokyo Night palette
Bg=#1a1b26
BgDark=#16161e
Surface=#32344a
SelBg=#283457
Fg=#a9b1d6
FgBright=#c0caf5
FgDark=#787c99
Comment=#444b6a
Blue=#7aa2f7
Cyan=#0db9d7
LightCyan=#7dcfff
Teal=#449dab
Yellow=#e0af68
Green=#9ece6a
Red=#f7768e
BrightRed=#ff7a93
Purple=#bb9af7
Magenta=#ad8ee6
DarkRed=#6f3a3f
DarkGreen=#2d4a3a
DarkRedTint=#4d2d3a

[core]
_default_=Fg;Bg
selected=FgBright;SelBg
marked=Yellow;;bold
markselect=Yellow;SelBg;bold
gauge=;SelBg
input=Fg;Surface
inputunchanged=FgDark;Surface
inputmark=Bg;Blue
disabled=Comment;Surface
reverse=Bg;Fg
hintbar=default;default
shellprompt=default;default
commandline=default;default
commandlinemark=Bg;Blue
header=Blue;Bg
shadow=Comment;BgDark
frame=Fg;Bg
spinner_sequence=▲▲◀◀▼▼▶▶

[dialog]
_default_=Fg;Comment
dfocus=FgBright;SelBg
dhotnormal=;;underline
dhotfocus=FgBright;SelBg;underline
dselnormal=;SelBg
dselfocus=white;SelBg
dtitle=;;bold
dframe=Fg;Comment

[error]
_default_=Red;BgDark;bold
errdfocus=BgDark;Red;bold
errdhotnormal=Yellow;BgDark;bold+underline
errdhotfocus=BgDark;Red;bold+underline
errdtitle=FgBright;BgDark;bold
errdframe=Red;BgDark

[filehighlight]
_default_=
directory=Blue
executable=Green
symlink=Cyan
hardlink=LightCyan
stalelink=Red
device=Magenta
special=Yellow
core=Red
temp=FgDark
archive=Yellow
doc=Purple
source=Teal
media=Green
graph=Cyan
database=BrightRed

[menu]
_default_=Fg;Comment
menusel=FgBright;SelBg
menuhot=Yellow;Comment
menuhotsel=Yellow;SelBg;underline
menuinactive=FgDark;Surface
menuframe=Fg;Comment

[popupmenu]
_default_=Fg;Comment
menusel=FgBright;SelBg
menutitle=FgBright;Comment;bold
menuframe=Fg;Comment

[buttonbar]
hotkey=Red;Surface
button=Fg;Surface

[statusbar]
_default_=FgBright;SelBg

[help]
_default_=Fg;Surface
helpbold=Blue;Surface;bold
helpitalic=Yellow;Surface;italic
helplink=Cyan;Surface;underline
helpslink=Bg;Cyan
helpframe=Fg;Surface

[editor]
_default_=Fg;Bg
editbold=Yellow;Bg;bold
editmarked=FgBright;SelBg
editwhitespace=Comment;Bg
editnonprintable=Red;Bg
editlinestate=FgDark;Surface
bookmark=Bg;Yellow
bookmarkfound=Bg;Green
editrightmargin=Comment;Surface
editbg=;BgDark
editframe=Comment
editframeactive=Blue
editframedrag=FgBright

[viewer]
_default_=Fg;Bg
viewbold=white;Bg;bold
viewunderline=Cyan;Bg;underline
viewboldunderline=#e0af68;Bg;bold+underline
viewselected=Bg;Yellow
viewframe=Fg;Bg
viewheading=lightgray

[diffviewer]
added=;#1b503b
changedline=;#1b2167
changednew=;#1c7348
changed=;#5f1c3e
removed=;#5f1c3e
error=FgBright;DarkRed

[mctree]
_default_=Fg;Bg
key=Blue;Bg
value=Green;Bg
marker=Yellow;Bg
selected=FgBright;SelBg

[widget-panel]
sort-up-char=▴
sort-down-char=▾
hiddenfiles-show-char=•
hiddenfiles-hide-char=○
history-prev-item-char=◂
history-next-item-char=▸
history-show-list-char=▾
filename-scroll-left-char=◂
filename-scroll-right-char=▸

[widget-editor]
window-state-char=↕
window-close-char=✕

[mcterm]
_default_=Fg;Bg
mctermselected=FgBright;SelBg

[mcstruct-tree]
_default_=Fg;Bg
frame=Comment;Bg
frame-active=Blue;Bg
head=FgBright;Surface;bold
selected=FgBright;SelBg
offset=FgDark;Bg
name=Fg;Bg
type=Cyan;Bg
value=Green;Bg
struct=Yellow;Bg;bold
jump=Purple;Bg;underline
remark=FgDark;Bg;italic
error=FgBright;DarkRed

[mcstruct-hex]
_default_=Fg;Bg
head=FgBright;Surface;bold
offset=FgDark;Bg
mark=Purple;Bg
changed=BrightRed;Bg
cursor=FgBright;SelBg
frame=Comment;Bg
block=Bg;Teal

[mcstruct-def]
_default_=Fg;Bg
frame=Comment;Bg
frame-active=Blue;Bg
head=FgBright;Surface;bold
selected=FgBright;SelBg
lineno=FgDark;Bg
directive=Yellow;Bg;bold
comment=FgDark;Bg;italic
