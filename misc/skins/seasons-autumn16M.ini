# The Four Seasons skins demonstrate how to use direct RGB true colors.

[skin]
    # Falling leaves, beautiful forests, Halloween pumpkins.
    # Also search for "Why are autumn leaves yellow in Europe, red in America?"
    description = Four Seasons – Autumn
    truecolors = true

[lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ═
    dvert = ║
    dlefttop = ╔
    drighttop = ╗
    dleftbottom = ╚
    drightbottom = ╝
    dtopmiddle = ╤
    dbottommiddle = ╧
    dleftmiddle = ╟
    drightmiddle = ╢

[scrollbar]
    vstart = ^
    vend = v
    vtrack = │
    vthumb = █
    vthumblen = 6
    hstart = <
    hend = >
    htrack = ─
    hthumb = ■
    hthumblen = 4

[aliases]
    Main = #992005
    MainFg = #ffa
    MarkedFg = #ff5
    HeaderFg = MarkedFg
    Selected = #681400
    Dialog = #85a918
