    permspecial = brown
    spinner_sequence = ⠈⠐⠠⢀⡀⠄⠂⠁⠉⠘⠰⢠⣀⡄⠆⠃⠋⠙⠸⢰⣠⣄⡆⠇⠏⠛⠹⢸⣰⣤⣆⡇⡏⠟⠻⢹⣸⣴⣦⣇⣏⡟⠿⢻⣹⣼⣶⣧⣯⣟⡿⢿⣻⣽⣾⣷⣿⣯⣏⡏⠏⠋⠉

