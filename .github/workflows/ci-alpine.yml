name: ci-alpine

on:
  workflow_call:

jobs:
  build-alpine:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    container:
      image: alpine:latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          apk add build-base meson pkgconf sudo
          apk add acl-dev check-dev e2fsprogs-dev gettext-dev glib-dev gpm-dev libssh2-dev perl slang-dev

      - name: Build default configuration
        run: |
          adduser --home "$(pwd)" --no-create-home --disabled-password test
          chown -R test "$(pwd)"

          su - test -c ' \
            meson setup build --prefix="$(pwd)/install-prefix" -Dmclib=true -Dwerror=true && \
            meson compile -C build && \
            meson test -C build --print-errorlogs && \
            meson install -C build \
          '

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-logs-alpine
          path: build/meson-logs/*.txt
