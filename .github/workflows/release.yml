name: Build release packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build'
        required: true
      upload_to_ppa:
        description: 'Upload to the PPA as well'
        type: boolean
        default: false
      ppa_revision:
        description: 'Debian revision of the PPA upload; raise it to upload the same version again'
        default: '1'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'blue-panels/mcommander'
    outputs:
      version: ${{ steps.build.outputs.version }}

    steps:
      # No ref: the recipes are repository tooling, kept out of the archive by
      # export-ignore, and release-source.sh takes the release content from the
      # tag itself. Checking the tag out would mean older tags cannot be built.
      - uses: actions/checkout@v7
        with:
          # release-source.sh reads the tag object; prepare.sh reads every tag.
          fetch-depth: 0

      - name: Install the bootstrap tooling
        # autogen.sh inside the archive needs these; autopoint in particular is
        # a package of its own on Debian and Ubuntu, only suggested by gettext.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              autoconf automake libtool gettext autopoint

      - name: Build the release archive
        id: build
        run: |
          version="${TAG#v}"
          packaging/release-source.sh "$version" "$TAG" "dist/mcommander-$version.tar.gz"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: source-archive
          path: dist/*.tar.gz
          overwrite: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A draft: the notes are written by hand. The archive is attached now
          # so that its download link, and its checksum, are settled.
          version="${{ steps.build.outputs.version }}"
          archive="dist/mcommander-$version.tar.gz"
          notes="Release notes pending. b2: $(b2sum "$archive" | cut -d' ' -f1)"

          # A rerun, after a failure in one of the builds, must not stop here.
          if gh release view "$TAG" >/dev/null 2>&1; then
              echo "release $TAG exists: replacing the archive"
              gh release upload "$TAG" "$archive" --clobber
          else
              gh release create "$TAG" "$archive" --draft --title "$TAG" --notes "$notes"
          fi

  debian:
    needs: archive
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    name: Debian packages (${{ matrix.name }})
    # No fail-fast: what one distribution builds is attached to the release
    # even when the other fails, see the publish job.
    #
    # arm64 is built on a native runner. The images are multi-architecture, so
    # the recipe below is the same one; emulation would not fit the timeout.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian Trixie amd64
            container: debian:trixie
            distribution: trixie
            lintian_profile: debian
            suffix: ~debian13.1
            artifact: debian-trixie-amd64-packages
            runs-on: ubuntu-latest
          - name: Debian Trixie arm64
            container: debian:trixie
            distribution: trixie
            lintian_profile: debian
            suffix: ~debian13.1
            artifact: debian-trixie-arm64-packages
            runs-on: ubuntu-24.04-arm
          - name: Ubuntu 26.04 amd64
            container: ubuntu:26.04
            distribution: resolute
            lintian_profile: ubuntu
            suffix: ~ubuntu26.04.1
            artifact: ubuntu-resolute-amd64-packages
            runs-on: ubuntu-latest
          - name: Ubuntu 26.04 arm64
            container: ubuntu:26.04
            distribution: resolute
            lintian_profile: ubuntu
            suffix: ~ubuntu26.04.1
            artifact: ubuntu-resolute-arm64-packages
            runs-on: ubuntu-24.04-arm
    container: ${{ matrix.container }}
    env:
      VERSION: ${{ needs.archive.outputs.version }}
      DEBIAN_FRONTEND: noninteractive
      DEB_DISTRIBUTION: ${{ matrix.distribution }}
      DEB_VERSION_SUFFIX: ${{ matrix.suffix }}

    steps:
      - name: Install the build tooling
        # git first: without it actions/checkout downloads a tarball and
        # prepare.sh has no tags to read.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
              git ca-certificates build-essential dpkg-dev lintian

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: source-archive
          path: dist

      - name: Build the source and binary packages
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          packaging/prepare.sh "$VERSION" "dist/mcommander-$VERSION.tar.gz"

          # Built from the release archive with debian/ copied in, not from the
          # checkout: that keeps the source package free of patches, since the
          # archive carries mc-version.h and no debian directory of its own.
          build=$(mktemp -d)
          cp "dist/mcommander-$VERSION.tar.gz" "$build/mcommander_$VERSION.orig.tar.gz"
          tar -xf "dist/mcommander-$VERSION.tar.gz" -C "$build"
          cp -r debian "$build/mcommander-$VERSION/"

          cd "$build/mcommander-$VERSION"
          # build-dep reads debian/control directly and names a dependency it
          # cannot satisfy. mk-build-deps went through equivs, where apt simply
          # removed its stub package again and said nothing about the cause.
          apt-get build-dep -y --no-install-recommends ./

          # Not as root: the extfs helper tests print <<uid>> for a file owned
          # by the current user, and half their expected outputs assume that is
          # not uid 0. Rules-Requires-Root is no, so nothing here wants root.
          useradd -m build
          chown -R build "$build"
          su build -c "cd '$build/mcommander-$VERSION' && dpkg-buildpackage -us -uc"

          cd ..
          # The series of the changes file is known to the vendor data of its
          # own distribution: the debian profile does not have resolute.
          lintian --fail-on error --profile "${{ matrix.lintian_profile }}" ./*.changes \
              || lintian_failed=1
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp ./*.deb ./*.dsc ./*.debian.tar.* ./*.changes "$GITHUB_WORKSPACE/out/"
          test -z "${lintian_failed:-}"

      # Also on failure: a lintian error fails the step above, and the packages
      # it produced are what one looks at to understand why.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: warn
          overwrite: true

  fedora:
    needs: archive
    runs-on: ${{ matrix.runs-on }}
    name: Fedora packages (${{ matrix.arch }})
    container: fedora:latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            artifact: fedora-amd64-packages
            runs-on: ubuntu-latest
          - arch: arm64
            artifact: fedora-arm64-packages
            runs-on: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.archive.outputs.version }}

    steps:
      - name: Install the build tooling
        run: dnf install -y git rpm-build rpmlint 'dnf-command(builddep)'

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: source-archive
          path: dist

      - name: Build the RPMs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          packaging/prepare.sh "$VERSION" "dist/mcommander-$VERSION.tar.gz"
          dnf builddep -y packaging/rpm/mcommander.spec

          # Not as root: the extfs helper tests print <<uid>> for a file owned
          # by the current user, and half their expected outputs assume that is
          # not uid 0. rpmbuild as root is discouraged in any case.
          useradd -m build
          su build -c 'mkdir -p ~/rpmbuild/SOURCES'
          install -o build -g build "dist/mcommander-$VERSION.tar.gz" /home/build/rpmbuild/SOURCES/
          install -o build -g build packaging/rpm/mcommander.spec /home/build/mcommander.spec
          su build -c 'rpmbuild -ba ~/mcommander.spec'

          rpmlint /home/build/rpmbuild/RPMS/*/*.rpm || true
          mkdir -p out
          cp /home/build/rpmbuild/RPMS/*/*.rpm /home/build/rpmbuild/SRPMS/*.rpm out/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          overwrite: true

  arch:
    needs: archive
    runs-on: ubuntu-latest
    # x86_64 only: Arch Linux itself has no aarch64 port, and the image below
    # is published for x86_64 alone. The PKGBUILD names aarch64 as well, for
    # Arch Linux ARM, which builds its packages from its own recipes.
    container: archlinux:base-devel
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.archive.outputs.version }}

    steps:
      - name: Install the build tooling
        run: pacman -Syu --noconfirm git sudo

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: source-archive
          path: dist

      - name: Build the packages
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          packaging/prepare.sh "$VERSION" "dist/mcommander-$VERSION.tar.gz"

          # makepkg refuses to run as root, and finds the archive next to the
          # PKGBUILD instead of downloading it. Its -s installs the dependencies
          # through sudo, so that user needs to use it without a password.
          cp "dist/mcommander-$VERSION.tar.gz" packaging/arch/
          useradd -m build
          echo 'build ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/build
          chown -R build packaging/arch
          su build -c 'cd packaging/arch && makepkg -s --noconfirm'
          mkdir -p out
          cp packaging/arch/*.pkg.tar.* out/

      - uses: actions/upload-artifact@v4
        with:
          name: arch-packages
          path: out/*
          overwrite: true

  arch-install:
    needs: [archive, arch]
    runs-on: ubuntu-latest
    # The only place the two packages meet: makepkg builds each on its own and
    # never notices when both claim the same file, and pacman refuses the pair
    # when they do. A plain image rather than base-devel, so a dependency that
    # only makepkg -s had pulled in is missed here rather than papered over -
    # though whatever the base image already carries still hides.
    container: archlinux:base
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.archive.outputs.version }}
      TERM: xterm

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arch-packages
          path: out

      - name: Install the packages the way a user would
        run: |
          pacman -Syu --noconfirm >/dev/null
          pacman -U --noconfirm \
            "out/mcommander-${VERSION}-"*.pkg.tar.zst \
            "out/mcommander-plugins-${VERSION}-"*.pkg.tar.zst
          # Grep rather than run and hope: without a usable TERM mc says so and
          # still exits 0, which would pass on nothing at all.
          mcommander --version | grep -q "v${VERSION}"
          mcedit6 --version | grep -q "v${VERSION}"
          test -d /usr/lib/mcommander/panel-plugins

  fedora-install:
    needs: [archive, fedora]
    runs-on: ${{ matrix.runs-on }}
    name: Fedora install (${{ matrix.arch }})
    # A plain image, not the one that built the packages: a dependency the
    # build pulled in is missed here rather than papered over.
    container: fedora:latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            artifact: fedora-amd64-packages
            runs-on: ubuntu-latest
          - arch: arm64
            artifact: fedora-arm64-packages
            runs-on: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.archive.outputs.version }}
      TERM: xterm

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out

      - name: Install the packages the way a user would
        run: |
          # The interpreters the extfs helpers are written with are required by
          # path, and a build that answered /usr/sbin/perl fails right here.
          dnf install -y \
            "out/mcommander-${VERSION}-"*.rpm \
            "out/mcommander-plugins-${VERSION}-"*.rpm
          # Grep rather than run and hope: without a usable TERM mc says so and
          # still exits 0, which would pass on nothing at all.
          mcommander --version | grep -q "v${VERSION}"
          mcedit6 --version | grep -q "v${VERSION}"
          test -d /usr/lib64/mcommander/panel-plugins

  debian-install:
    needs: [archive, debian]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    name: Debian install (${{ matrix.name }})
    # Each package is installed in the distribution and on the architecture it
    # was built for: they differ in the ABI they link to, so one of them
    # passing says nothing about the others.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian Trixie amd64
            container: debian:trixie
            artifact: debian-trixie-amd64-packages
            arch: amd64
            runs-on: ubuntu-latest
          - name: Debian Trixie arm64
            container: debian:trixie
            artifact: debian-trixie-arm64-packages
            arch: arm64
            runs-on: ubuntu-24.04-arm
          - name: Ubuntu 26.04 amd64
            container: ubuntu:26.04
            artifact: ubuntu-resolute-amd64-packages
            arch: amd64
            runs-on: ubuntu-latest
          - name: Ubuntu 26.04 arm64
            container: ubuntu:26.04
            artifact: ubuntu-resolute-arm64-packages
            arch: arm64
            runs-on: ubuntu-24.04-arm
    container: ${{ matrix.container }}
    env:
      VERSION: ${{ needs.archive.outputs.version }}
      DEBIAN_FRONTEND: noninteractive
      DEB_ARCH: ${{ matrix.arch }}
      TERM: xterm

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out

      - name: Install the packages the way a user would
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            "./out/mcommander_${VERSION}-"*_"${DEB_ARCH}.deb" \
            "./out/mcommander-plugins_${VERSION}-"*_"${DEB_ARCH}.deb" \
            "./out/mcommander-lua_${VERSION}-"*_"${DEB_ARCH}.deb"
          mcommander --version | grep -q "v${VERSION}"
          mcedit6 --version | grep -q "v${VERSION}"
          test -d /usr/lib/mcommander/panel-plugins

  macos:
    needs: archive
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.archive.outputs.version }}

    # A portability check, not a package: it says whether the release still
    # builds on macOS. The archive is self contained, so nothing else is needed
    # here, not even a checkout.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-archive
          path: dist

      - name: Install the libraries
        # The heavy optional ones, Samba and the Mongo driver, are left out:
        # their plugins are not what this check is about.
        run: brew install glib s-lang pkgconf gettext libssh2 libarchive libmagic

      - name: Build from the release archive
        run: |
          brew_prefix=$(brew --prefix)
          gettext_prefix=$(brew --prefix gettext)

          # Homebrew is not on the default search paths of the compiler, and
          # gettext is keg-only, so libintl has to be pointed at by hand.
          export CPPFLAGS="-I$brew_prefix/include -I$gettext_prefix/include"
          export LDFLAGS="-L$brew_prefix/lib -L$gettext_prefix/lib"
          export PKG_CONFIG_PATH="$brew_prefix/lib/pkgconfig:$(brew --prefix libarchive)/lib/pkgconfig"

          tar -xf "dist/mcommander-$VERSION.tar.gz"
          cd "mcommander-$VERSION"
          ./configure --prefix="$brew_prefix" --disable-static \
              --with-screen=slang
          make -j"$(sysctl -n hw.ncpu)"

          # A runner has no TERM, and mc sets up its terminal before it gets to
          # printing a version.
          TERM=xterm ./src/mcommander --version

      - name: Keep the configure log of a failed build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-config-log
          path: mcommander-*/config.log
          if-no-files-found: warn
          overwrite: true

  macos-package:
    needs: [archive]
    name: macOS package (${{ matrix.name }})
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    # Each architecture is built on a native runner: Homebrew libraries are
    # architecture-bound, so cross-compiling needs a universal copy of every
    # dependency, which is more machinery than a native build of the same
    # things. The artifact names end in -packages, matching the publish job.
    #
    # Intel is left out: macos-15-intel reports the sequoia tag, and
    # homebrew-core has no Intel bottles for it, so glib, samba, the Mongo
    # driver and the rest would all be built from source. The matrix keeps its
    # shape so that a runner with bottles can be added back later.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            suffix: arm64
            runs-on: macos-latest
    runs-on: ${{ matrix.runs-on }}
    env:
      VERSION: ${{ needs.archive.outputs.version }}
      SUFFIX: ${{ matrix.suffix }}
      NAME: ${{ matrix.name }}

    # The macOS build: a .pkg installer, and a .dmg carrying it. The check job
    # above stays fast by leaving Samba and the Mongo driver out; this package
    # is what a macOS user downloads.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source-archive
          path: dist

      - name: Install the libraries
        run: brew install glib s-lang pkgconf gettext libssh2 libarchive libmagic samba mongo-c-driver dylibbundler

      - name: Build and stage the package
        run: |
          brew_prefix=$(brew --prefix)
          gettext_prefix=$(brew --prefix gettext)

          # Homebrew is not on the default search paths of the compiler, and
          # the keg-only formulas have to be pointed at by hand.
          export CPPFLAGS="-I$brew_prefix/include -I$gettext_prefix/include"
          export LDFLAGS="-L$brew_prefix/lib -L$gettext_prefix/lib"
          export PKG_CONFIG_PATH="$brew_prefix/lib/pkgconfig:$(brew --prefix libarchive)/lib/pkgconfig"

          tar -xf "dist/mcommander-$VERSION.tar.gz"
          cd "mcommander-$VERSION"
          # Keep the package out of Homebrew's prefixes on both architectures.
          # DESTDIR stages the tree; pkgbuild puts stage/opt/mcommander at /opt/mcommander.
          ./configure --prefix=/opt/mcommander --disable-static \
              --with-screen=slang \
              --enable-mctree-magic=yes \
              --enable-panel-plugin-samba=yes \
              --enable-panel-plugin-mongo=yes \
              --with-magic-file=/opt/mcommander/share/misc/magic.mgc
          make -j"$(sysctl -n hw.ncpu)"
          make install DESTDIR="$(pwd)/stage"

          # libmagic's compiled database is a runtime dependency too.
          install -d stage/opt/mcommander/share/misc
          install -m 0644 "$(brew --prefix libmagic)/share/misc/magic.mgc" \
              stage/opt/mcommander/share/misc/magic.mgc

          # These are required package contents, not best-effort plugins.
          test -f stage/opt/mcommander/lib/mcommander/panel-plugins/samba/mc-panel-samba.so
          test -f stage/opt/mcommander/lib/mcommander/panel-plugins/mongo/mc-panel-mongo.so

      - name: Bundle and verify runtime dependencies
        run: |
          source_dir="mcommander-$VERSION"
          cd "$source_dir"
          stage_prefix="stage/opt/mcommander"
          bundled_libs="$stage_prefix/lib"

          # Use one install name for every dependency. LC_RPATH is relative to
          # each Mach-O below, so binaries, plug-ins and dylibs resolve it from
          # their own locations.
          bundle_args=(
            -b -cd -of -ns
            -d "$bundled_libs"
            -p '@rpath/'
            -i /usr/lib
            -i /System/Library
            -x "$stage_prefix/bin/mcommander"
          )
          while IFS= read -r -d '' plugin; do
              bundle_args+=(-x "$plugin")
          done < <(find "$stage_prefix/lib/mcommander/panel-plugins" -name '*.so' -type f -print0)
          if ! dylibbundler "${bundle_args[@]}" > dylibbundler.log 2>&1; then
              tail -n 200 dylibbundler.log
              exit 1
          fi
          tail -n 20 dylibbundler.log

          # grep -q closes the pipe on the first match, awk is then killed by
          # EPIPE, and under pipefail the whole pipeline fails although the
          # path was there.  Read the list into a variable and match on that.
          rpaths() {
              otool -l "$1" | awk '$2 == "LC_RPATH" { getline; getline; print $2 }'
          }

          add_rpath() {
              file=$1
              rpath=$2
              if ! grep -Fqx "$rpath" <<<"$(rpaths "$file")"; then
                  install_name_tool -add_rpath "$rpath" "$file"
              fi
          }

          # dylibbundler also rewrites pre-existing Homebrew LC_RPATH entries
          # to its install path. @rpath/ cannot locate anything by itself;
          # replace it with one loader-relative path per Mach-O class below.
          while IFS= read -r -d '' file; do
              if ! file -b "$file" | grep -q 'Mach-O'; then
                  continue
              fi
              while grep -Fqx '@rpath/' <<<"$(rpaths "$file")"; do
                  install_name_tool -delete_rpath '@rpath/' "$file"
              done
          done < <(find "$stage_prefix" -type f -print0)

          add_rpath "$stage_prefix/bin/mcommander" '@loader_path/../lib'
          while IFS= read -r -d '' plugin; do
              add_rpath "$plugin" '@loader_path/../../..'
          done < <(find "$stage_prefix/lib/mcommander/panel-plugins" -name '*.so' -type f -print0)
          while IFS= read -r -d '' library; do
              add_rpath "$library" '@loader_path'
          done < <(find "$bundled_libs" -maxdepth 1 -name '*.dylib' -type f -print0)

          # install_name_tool invalidates arm64 signatures. Sign every Mach-O
          # after its final modification, including plug-ins and bundled libs.
          while IFS= read -r -d '' file; do
              if file -b "$file" | grep -q 'Mach-O'; then
                  codesign -f -s - "$file"
              fi
          done < <(find "$stage_prefix" -type f -print0)

          # No staged Mach-O may retain a build-host Homebrew dependency or
          # runpath. Also verify every ad-hoc signature before hiding Homebrew.
          audit_failed=no
          while IFS= read -r -d '' file; do
              if ! file -b "$file" | grep -q 'Mach-O'; then
                  continue
              fi
              echo "Auditing $file"
              macho_info=$(otool -L "$file"; otool -l "$file")
              if printf '%s\n' "$macho_info" \
                  | grep -E '/opt/homebrew|/usr/local/(Cellar|opt|lib)'; then
                  audit_failed=yes
              fi
              if grep -Fqx '@rpath/' <<<"$(rpaths "$file")"; then
                  echo "Unresolved LC_RPATH in $file"
                  audit_failed=yes
              fi
              codesign --verify --strict "$file"
          done < <(find "$stage_prefix" -type f -print0)
          test "$audit_failed" = no

          # Prove that dyld does not fall back to the runner's Homebrew tree.
          brew_prefix=$(brew --prefix)
          brew_off="${brew_prefix}.mcommander-off"
          test ! -e "$brew_off"
          restore_brew() {
              if test -e "$brew_off" && test ! -e "$brew_prefix"; then
                  sudo /bin/mv "$brew_off" "$brew_prefix"
              fi
          }
          trap restore_brew EXIT HUP INT TERM
          sudo /bin/mv "$brew_prefix" "$brew_off"
          TERM=xterm "$stage_prefix/bin/mcommander" --version
          restore_brew
          trap - EXIT HUP INT TERM

      - name: Build the .pkg and .dmg
        run: |
          mkdir -p out dmg

          # The installer is not Developer ID signed or notarized. The bundled
          # Mach-O files carry ad-hoc signatures so arm64 can execute them.
          pkgbuild \
            --root "mcommander-$VERSION/stage" \
            --identifier "com.mcdev.mcommander" \
            --version "$VERSION" \
            "out/mcommander-$VERSION-macos-$SUFFIX.pkg"

          cp "out/mcommander-$VERSION-macos-$SUFFIX.pkg" dmg/
          printf '%s\n' \
            "M-Commander $VERSION - $NAME" \
            '' \
            'Double-click the .pkg and follow the installer.' \
            'It installs mcommander, mc6, mcedit6, mview and mcdiff6 under /opt/mcommander.' \
            'Run /opt/mcommander/bin/mcommander, or add /opt/mcommander/bin to your PATH.' \
            'The package includes its runtime libraries; Homebrew is not required.' \
            '' \
            'This package is not Developer ID signed or notarized.' \
            'macOS may block it until you allow it in Privacy & Security.' \
            > dmg/README.txt
          hdiutil create \
            -volname "mcommander-$VERSION-macos-$SUFFIX" \
            -srcfolder dmg \
            -ov -format UDZO \
            "out/mcommander-$VERSION-macos-$SUFFIX.dmg"

      - name: Keep the configure log of a failed build
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.suffix }}-config-log
          path: mcommander-*/config.log
          if-no-files-found: warn
          overwrite: true

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.suffix }}-packages
          path: out/*
          overwrite: true

  ppa:
    needs: archive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Set PPA_SERIES to switch this on, as a space separated list of series
    # with their Ubuntu versions: "resolute:26.04 noble:24.04 jammy:22.04".
    if: vars.PPA_SERIES != ''
    env:
      VERSION: ${{ needs.archive.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: source-archive
          path: dist

      - name: Install dput
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dput

      - name: Import the upload key
        env:
          PPA_GPG_KEY: ${{ secrets.PPA_GPG_KEY }}
        run: |
          test -n "$PPA_GPG_KEY" || { echo "PPA_GPG_KEY is not set" >&2; exit 1; }
          printf '%s\n' "$PPA_GPG_KEY" | gpg --batch --quiet --import
          # This key exists only to sign PPA uploads, so it is the only one here.
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')
          test -n "$key" || { echo "no secret key was imported" >&2; exit 1; }
          echo "SIGN_KEY=$key" >> "$GITHUB_ENV"

      - name: Build and upload the source packages
        env:
          PPA: ${{ vars.PPA_TARGET || 'ppa:bluepanels/mcommander' }}
          SERIES: ${{ vars.PPA_SERIES }}
          # A tag push publishes. A manual run is a rehearsal unless it asks to
          # publish: a PPA keeps every version it has ever accepted, so an
          # accidental upload cannot be taken back.
          REQUESTED: ${{ github.event_name != 'workflow_dispatch' || inputs.upload_to_ppa }}
          # A PPA takes a version once. The recipes it was built with live
          # outside the tag, so a fixed recipe reaches it as a new revision of
          # the same version.
          PPA_REVISION: ${{ github.event.inputs.ppa_revision || '1' }}
        run: |
          if test "$REQUESTED" = true; then
              upload=yes
          else
              upload=no
              echo "rehearsal: building and signing, not uploading to $PPA"
          fi

          UPLOAD="$upload" packaging/ppa-source.sh \
              "$VERSION" "dist/mcommander-$VERSION.tar.gz" $SERIES

      - uses: actions/upload-artifact@v4
        with:
          name: ppa-source
          path: dist/ppa/*
          overwrite: true

  publish:
    needs: [debian, fedora, arch, arch-install, fedora-install, debian-install, macos-package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs even when a distribution failed: what did get built is still worth
    # attaching, and rerunning the failed job afterwards adds the rest.
    if: always()

    steps:
      # One directory per artifact, not merged: the source package, the source
      # RPM and the architecture-independent data package are built on both
      # architectures and carry the same name on each, so merging would put two
      # copies of them in one place. The step below keeps the first of each.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: packages
          pattern: '*-packages'

      - name: Attach the packages to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A release asset is named by its file name alone, so a name may only
          # be uploaded once. Sorting by name and keeping the first path of
          # each picks one build of the files that both architectures produce.
          mkdir -p packages
          find packages -type f -printf '%f\t%p\n' | sort -u -k1,1 | cut -f2 > files
          if ! test -s files; then
              echo "nothing was built: nothing to attach"
              exit 0
          fi
          xargs -a files -d '\n' \
              gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY"
