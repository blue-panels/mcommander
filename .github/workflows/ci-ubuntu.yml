name: ci-ubuntu

on:
  workflow_call:

jobs:
  build-ubuntu-resolute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: ubuntu:26.04

    permissions:
      contents: read

    steps:
      - name: Install dependencies
        run: |
          # The container points at archive.ubuntu.com, which has taken over ten
          # minutes for these packages; the runner's own mirror is next door.
          sed -i 's|http://archive.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|' /etc/apt/sources.list.d/ubuntu.sources
          echo 'Acquire::Retries "3";' > /etc/apt/apt.conf.d/80-retries
          apt-get update
          apt-get install -y git autoconf automake autopoint build-essential gettext libtool pkg-config
          apt-get install -y e2fslibs-dev libglib2.0-dev libgpm-dev libncurses-dev libslang2-dev libssh2-1-dev libx11-dev libarchive-dev libcurl4-openssl-dev libsmbclient-dev libmongoc-dev libbson-dev unzip

      - uses: actions/checkout@v7

      - name: Build MongoDB plugin with MongoDB C Driver v2
        run: |
          # The checkout belongs to another user than the root this container
          # runs as, and git refuses to read a repository it finds suspicious.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          ./autogen.sh

          # Named twice on purpose: this step runs in the shell of the container,
          # and $_ of the jobs on the runner is a bash thing that sh does not have.
          mkdir -p build-mongo
          cd build-mongo

          ../configure --enable-panel-plugin-mongo=yes

          make -j$(nproc)
          test -f src/panel-plugins/mongo/.libs/mc-panel-mongo.so

  build-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autopoint check gettext libtool pkg-config
          sudo apt-get install -y e2fslibs-dev libglib2.0-dev libgpm-dev libncurses5-dev libslang2-dev libssh2-1-dev libx11-dev unzip

      - name: Bootstrap build system
        run: ./autogen.sh

      - name: Build distribution archive
        run: |
          mkdir -p build-distrib && cd $_

          ../configure

          make dist-bzip2

      - name: Build full configuration
        run: |
          tar -xjf $(ls build-distrib/*.tar.bz2) --one-top-level=build-full
          cd build-full

          ../configure \
              --prefix="$(pwd)/install" \
              --enable-mclib \
              --enable-werror

          make -j$(nproc)
          make check
          make install

      - name: Build ncurses configuration
        run: |
          tar -xjf $(ls build-distrib/*.tar.bz2) --one-top-level=build-ncurses
          cd build-ncurses

          ../configure \
              --prefix="$(pwd)/install" \
              --with-screen=ncurses \
              --enable-werror

          make -j$(nproc)
          make check

      - name: Build minimal configuration
        run: |
          tar -xjf $(ls build-distrib/*.tar.bz2) --one-top-level=build-minimal
          cd build-minimal

          ../configure \
              --prefix="$(pwd)/install" \
              --disable-shared \
              --disable-static \
              --disable-maintainer-mode \
              --disable-largefile \
              --disable-nls \
              --disable-rpath \
              --disable-mclib \
              --disable-assert \
              --disable-background \
              --disable-vfs \
              --without-x \
              --without-gpm-mouse \
              --without-internal-edit \
              --without-diff-viewer \
              --without-subshell \
              --enable-tests \
              --enable-werror

            make -j$(nproc)
            make check

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-suite-logs-ubuntu
          path: build-*/**/test-suite.log

  check-glib-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build and test with GLib 2.58
        run: sh maint/check-glib-api.sh
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: glib-258-logs
          path: |
            /tmp/mc-glib-api.*/*.log
            /tmp/mc-glib-api.*/build/**/test-suite.log
