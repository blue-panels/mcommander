name: ci-ubuntu

on:
  workflow_call:

jobs:
  build-ubuntu-resolute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: ubuntu:26.04

    permissions:
      contents: read

    steps:
      - name: Install dependencies
        run: |
          # The container points at archive.ubuntu.com, which has taken over ten
          # minutes for these packages; the runner's own mirror is next door.
          sed -i 's|http://archive.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|' /etc/apt/sources.list.d/ubuntu.sources
          echo 'Acquire::Retries "3";' > /etc/apt/apt.conf.d/80-retries
          apt-get update
          apt-get install -y git build-essential gettext meson ninja-build pkg-config
          apt-get install -y e2fslibs-dev libglib2.0-dev libgpm-dev libncurses-dev libslang2-dev libssh2-1-dev libx11-dev libarchive-dev libcurl4-openssl-dev libsmbclient-dev libacl1-dev libmongoc-dev libbson-dev libpq-dev unzip

      - uses: actions/checkout@v7

      - name: Build MongoDB plugin with MongoDB C Driver v2
        run: |
          # The checkout belongs to another user than the root this container
          # runs as, and git refuses to read a repository it finds suspicious.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          meson setup build-mongo -Dpanel_plugin_mongo=enabled
          meson compile -C build-mongo
          test -f build-mongo/src/panel-plugins/mongo/mc-panel-mongo.so

  build-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          # meson dist packs the git tree: it needs the tags version.sh reads
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y check gettext meson ninja-build pkg-config
          sudo apt-get install -y e2fslibs-dev libglib2.0-dev libgpm-dev libncurses5-dev libslang2-dev libssh2-1-dev libx11-dev unzip

      - name: Build distribution archive
        run: |
          meson setup build-distrib
          meson dist -C build-distrib --formats=xztar --no-tests

          # the other configurations build from the archive, to see that it has everything
          mkdir -p dist-src
          tar -xJf build-distrib/meson-dist/*.tar.xz -C dist-src --strip-components=1

      - name: Build full configuration
        run: |
          meson setup build-full dist-src \
              --prefix="$(pwd)/install" \
              -Dmclib=true \
              -Dwerror=true
          meson compile -C build-full
          meson test -C build-full --print-errorlogs
          meson install -C build-full

      - name: Build ncurses configuration
        run: |
          meson setup build-ncurses dist-src \
              --prefix="$(pwd)/install" \
              -Dscreen=ncurses \
              -Dwerror=true
          meson compile -C build-ncurses
          meson test -C build-ncurses --print-errorlogs

      - name: Build minimal configuration
        run: |
          meson setup build-minimal dist-src \
              --prefix="$(pwd)/install" \
              -Dnls=disabled \
              -Dmclib=false \
              -Dassert=false \
              -Dbackground=false \
              -Dvfs=false \
              -Dx11=disabled \
              -Dgpm=disabled \
              -Dinternal_edit=false \
              -Ddiff_viewer=false \
              -Dtests=enabled \
              -Dwerror=true
          meson compile -C build-minimal
          meson test -C build-minimal --print-errorlogs

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-logs-ubuntu
          path: build-*/meson-logs/*.txt

  check-glib-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build and test with GLib 2.58
        run: sh maint/check-glib-api.sh
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: glib-258-logs
          path: |
            /tmp/mc-glib-api.*/*.log
            /tmp/mc-glib-api.*/build/meson-logs/*.txt
