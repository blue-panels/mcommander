name: ci-sandbox

on:
  workflow_call:
    inputs:
      transports:
        description: comma separated, out of local, sftp, ftp, smb, sh
        type: string
        default: local
      subjects:
        description: comma separated subjects, empty for every one
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      transports:
        description: comma separated, out of local, sftp, ftp, smb, sh
        type: string
        default: local,sftp,ftp,smb,sh
      subjects:
        description: comma separated subjects, empty for every one
        type: string
        default: ''
  # The cases take minutes, so a push does not wait for them: a pull request
  # runs them when it is given the 'sandbox' label.
  pull_request:
    types: [ opened, synchronize, reopened, labeled ]
  schedule:
    # Over the network the same cases take three times as long, so they run
    # once a night rather than on every push.
    - cron: '17 2 * * *'

jobs:
  sandbox-debian-12:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'sandbox')

    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    env:
      # A run with no inputs is either the nightly one, which goes over the
      # network, or a labelled pull request, which stays on a local directory.
      TRANSPORTS: >-
        ${{ inputs.transports
            || (github.event_name == 'schedule' && 'local,sftp,ftp,smb,sh')
            || 'local' }}
      SUBJECTS: ${{ inputs.subjects || '' }}
      # A runner is slower than the machine these waits were written on, and a
      # wait that runs out fails a case that would have passed.
      SLOW: 2

    steps:
      - uses: actions/checkout@v7

      - name: Build the image and mc
        run: tests/misc/docker/sandbox.sh debian-12 up

      - name: Every plugin loads
        run: tests/misc/docker/sandbox.sh debian-12 check plugins

      - name: Every protocol answers
        if: env.TRANSPORTS != 'local'
        run: tests/misc/docker/sandbox.sh debian-12 check remote

      - name: Press the keys
        run: |
          args="-w $TRANSPORTS"
          if [ -n "$SUBJECTS" ]; then
            args="$args -c $SUBJECTS"
          fi
          tests/misc/docker/ci.sh debian-12 $args

      - name: The report
        if: always()
        run: cat tests/misc/docker/reports/*-ci/index.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: sandbox-report-debian-12
          path: tests/misc/docker/reports/

  session:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'sandbox')

    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y check gettext meson ninja-build pkg-config
          sudo apt-get install -y e2fslibs-dev libglib2.0-dev libgpm-dev libncurses5-dev libslang2-dev libssh2-1-dev libx11-dev unzip

      - name: Build
        run: |
          meson setup build -Dsession=enabled
          meson compile -C build

      - name: The session test
        run: |
          MC_BIN="$PWD/build/src/mcommander" \
          SESSION_PLUGIN="$PWD/build/src/session/session.so" \
          MC_SESSION_HELPER="$PWD/build/src/session/session_helper" \
          MC_DATADIR="$PWD/misc" \
          tests/misc/session.py
